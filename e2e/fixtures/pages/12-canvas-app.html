<!doctype html><html><head><meta charset="utf-8"><title>Canvas app</title>
<style>body{margin:0;font:14px system-ui}</style></head><body>
<div style="padding:30px">
  <canvas id="board" width="400" height="220" style="display:block;border:1px solid #999"></canvas>
</div>
<script>
  const c = document.getElementById('board').getContext('2d')
  c.fillStyle = '#eef'; c.fillRect(0,0,400,220)
  c.fillStyle = '#333'; c.fillRect(40,40,120,60)
</script>
<script src="../../harness/bundle.js"></script>
<script type="application/json" id="probes">[
 {"x":120,"y":110,"expect":"#board","why":"a canvas app has no inner DOM — the canvas itself is the only honest target"}
]</script></body></html>
