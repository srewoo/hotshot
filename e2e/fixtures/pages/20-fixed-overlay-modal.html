<!doctype html><html><head><meta charset="utf-8"><title>Modal</title>
<style>body{margin:0;font:14px system-ui}</style></head><body>
<main style="height:1400px;padding:30px"><p>page behind</p></main>
<div id="scrim" style="position:fixed;inset:0;background:rgba(0,0,0,.4)"></div>
<div id="modal" style="position:fixed;left:50%;top:80px;transform:translateX(-50%);width:360px;height:200px;background:#fff;border:1px solid #999;padding:20px">
  <h2 id="modal-title" style="margin:0">Modal title</h2>
</div>
<script>window.scrollTo(0,300)</script>
<script src="../../harness/bundle.js"></script>
<script type="application/json" id="probes">[
 {"x":640,"y":180,"expect":"#modal","why":"a fixed modal is the intent, not the scrim behind it"},
 {"x":640,"y":112,"expect":"#modal-title","why":"the heading inside the modal is the innermost real target"},
 {"x":100,"y":600,"expect":"#scrim","why":"over the scrim itself there is nothing better to offer, so the fallback returns it rather than nothing"}
]</script></body></html>
